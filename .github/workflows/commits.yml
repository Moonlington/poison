name: commits

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit subjects
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          zero="0000000000000000000000000000000000000000"
          if [ -n "${BASE:-}" ] && [ "${BASE:-}" != "$zero" ] && git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            range="$BASE..$SHA"
          elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "$zero" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            range="$BEFORE..$SHA"
          else
            # New branch, or a force push whose previous head is no longer
            # reachable and therefore not fetched: check the tip commit only.
            range="$SHA~1..$SHA"
          fi

          echo "Checking: $range"
          fail=0
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'
          while IFS= read -r subject; do
            case "$subject" in
              "Merge "*|"Revert "*|"fixup! "*|"squash! "*|"amend! "*) continue ;;
            esac
            if ! printf '%s' "$subject" | grep -Eq "$pattern"; then
              echo "✗ $subject"
              fail=1
            fi
            if [ ${#subject} -gt 72 ]; then
              echo "✗ too long (${#subject} chars): $subject"
              fail=1
            fi
          done <<EOF
          $(git log --format=%s "$range")
          EOF

          [ "$fail" -eq 0 ] && echo "all commit subjects follow Conventional Commits"
          exit "$fail"
