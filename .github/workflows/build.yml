name: build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  example-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.165.0'
          extended: true

      - name: Link theme into the example site
        run: |
          mkdir -p exampleSite/themes
          ln -sfn ../.. exampleSite/themes/poison

      - name: Build example site
        run: cd exampleSite && hugo --minify --gc --panicOnWarning

      - name: Assert expected output
        run: |
          set -eu
          test -f exampleSite/public/index.html
          test -f exampleSite/public/robots.txt
          test -f exampleSite/public/sitemap.xml
          # structured data present on an article page
          grep -q 'application/ld+json' exampleSite/public/posts/hello-world/index.html
          # exactly one H1 per document
          for f in exampleSite/public/index.html exampleSite/public/posts/hello-world/index.html; do
            test "$(grep -o '<h1' "$f" | wc -l)" -eq 1 || { echo "H1 count wrong in $f"; exit 1; }
          done
          # the sidebar brand is real markup, not escaped text: a template that
          # builds a tag name from an action (<{{ if }}h1{{ end }}>) is escaped
          # by html/template and renders visibly. Substring checks miss this.
          for f in exampleSite/public/index.html exampleSite/public/posts/hello-world/index.html; do
            grep -q '&lt;' "$f" && { echo "escaped markup in $f"; exit 1; }
            grep -Eq '<(h1|div) class="?brand"?' "$f" || { echo "no brand element in $f"; exit 1; }
            grep -q 'class=brand-title' "$f" || { echo "no brand text in $f"; exit 1; }
          done
          # Open Graph requires an absolute image URL; a relative one silently
          # breaks cards on some consumers. Every page must advertise one.
          for f in exampleSite/public/index.html exampleSite/public/posts/hello-world/index.html; do
            grep -Eq 'property="og:image" content="https://' "$f" || { echo "og:image not absolute in $f"; exit 1; }
            # hugo --minify drops quotes from simple attribute names
            grep -Eq 'name="?twitter:card"? content="summary' "$f" || { echo "no twitter:card in $f"; exit 1; }
          done
          echo "example site ok"
