# Poison — maintained fork of lukeorth/poison
name = "Poison"
license = "GPL-3.0 License"
licenselink = "https://github.com/Moonlington/poison/blob/master/LICENSE.md"
description = "A pragmatic Hugo theme for bloggers. Based on the classic \"Hyde\" design by mdo, with SEO, structured-data and accessibility fixes."
min_version = "0.165.0"

# The home page of the theme, where the source can be found.
homepage = "https://github.com/Moonlington/poison"

# If you have a running demo of the theme.
demosite = "https://poison.lukeorth.com"

tags = ["blog", "personal", "dark", "dark-mode", "light", "minimal"]
features = ["blog", "katex", "table-of-contents", "tabs", "dark-mode", "series", "json-ld", "robots-txt"]

[author]
    name = "Luke Orth"
    homepage = "https://lukeorth.com"

[maintainer]
    name = "Flore"
    homepage = "https://www.tabletopflore.com"

# If Porting existing theme
[original]
    author =  "mdo"
    homepage = "http://markdotto.com/"
    repo = "https://www.github.com/mdo/hyde"
